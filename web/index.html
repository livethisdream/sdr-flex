<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDR Flex — M0 toy model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="topbar" id="topbar"></div>
  <div class="tabs" id="tabs"></div>

  <div class="panes">
    <!-- Spectrum + waterfall: one tab, one shared frequency axis (ADR-0020) -->
    <div class="pane" id="pane-spectrum">
      <div class="stage" id="stage">
        <canvas id="sp" class="sp"></canvas>
        <div class="splitter" id="splitter" title="drag to resize the spectrum"></div>
        <canvas id="wf" class="wf"></canvas>
        <div class="markers" id="markers"></div>
        <span class="stagebadge" id="stagebadge" hidden></span>
        <div class="selbox" id="selbox" hidden></div>
        <div id="cbar-wrap" title="drag to set the dB range">
          <div class="cbar" id="cbar"></div>
          <span class="cb-l" id="cb-hi"></span>
          <span class="cb-l" id="cb-lo"></span>
        </div>
      </div>
      <div class="axis" id="axis"></div>
    </div>

    <div class="pane" id="pane-time" hidden>
      <div class="tstage"><canvas id="ts" class="ts"></canvas><span class="trig" id="trig"></span></div>
      <div class="axis" id="taxis"></div>
    </div>
    <div class="pane scrolly" id="pane-bits" hidden><div id="bits" class="bitwrap"></div></div>
    <div class="pane scrolly" id="pane-flow" hidden></div>
    <div class="pane scrolly" id="pane-events" hidden></div>
    <div class="pane scrolly" id="pane-audio" hidden></div>
  </div>

  <div class="dock">
    <div class="transport">
      <button id="back" class="tbtn" aria-label="back one second" title="back 1 s">◀◀</button>
      <button id="play" class="tbtn play" aria-label="play or pause">❚❚</button>
      <button id="fwd" class="tbtn" aria-label="forward one second" title="forward 1 s">▶▶</button>
      <span id="clock" class="mono clock">0.000 s</span>
      <button id="track" class="track" aria-label="scrub through time"><i></i></button>
    </div>
    <div class="strip" id="strip"></div>
  </div>

  <div class="metrics" id="metrics" hidden></div>
</div>

<div class="tip" id="tip" hidden></div>
<div class="hint" id="hint">Drag a box across the spectrum — the menu opens where you release.</div>

<script type="module" src="src/app.js"></script>
<script>
  // the on-ramp is an empty state, not permanent chrome (law 11)
  addEventListener('pointerup', function once() {
    const h = document.getElementById('hint');
    if (h) h.classList.add('gone');
    removeEventListener('pointerup', once);
  });
</script>
</body>
</html>
