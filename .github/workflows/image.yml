# Builds Dockerfile.full and publishes it, so the whole tool is one `docker run` on
# somebody else's machine instead of a twenty-minute build.
#
# On a pull request it only builds: a Dockerfile that no longer builds is found before it
# is merged rather than after. On `main` it also pushes `latest` and the commit's short sha
# to ghcr.io/<owner>/sdr-flex.
#
# The layer cache is what keeps this affordable. Nearly all of the build is compiling
# gr-lora_sdr and the other pinned decoders, and those layers change only when a pin
# does; a change to server/ or web/ rebuilds the last few layers in a minute or two.
#
# amd64 only. An arm64 build under emulation would compile GNU Radio's dependents for
# hours, and nobody has asked for one.
#
# A package GitHub creates is private until it is made public once, by hand, under the
# package's settings. Nothing here can do that.
name: Publish image

on:
  workflow_dispatch:
  pull_request:
    paths: ['Dockerfile.full', '.github/workflows/image.yml']
  push:
    branches: [main]
    paths: ['server/**', 'web/**', 'recipes/**', 'grc/**', 'fixtures/**',
            'seed-captures.mjs', 'Dockerfile.full', '.github/workflows/image.yml']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # The build stage carries GNU Radio's headers and a compiler toolchain, and the
      # runner's free disk is not much more than that. These are the runner's own SDKs,
      # none of which this build uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
