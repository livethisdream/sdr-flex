# Deploys the browser client to GitHub Pages.
#
# **The hosted version is the whole tool minus the box.** `web/` is static ES modules
# with no build step, and the client falls back to its in-tab engine when no websocket
# answers (ADR-0021) — so Pages serves a working tool rather than a demo. What it cannot
# have is anything that runs as a process: the external decoders, a radio, the capture
# library. `Identify` knows this and says so rather than offering a decoder that cannot
# run. Everything else — the DSP, the flowgraph, the views, the synthetic scene, a
# capture you drop on the window — is the same code the server serves.
#
# Only needed if Pages is set to Settings → Pages → Source → **GitHub Actions**, in
# which case web/ is published as the site root and no redirect is involved.
#
# If Pages is instead set to **Deploy from a branch**, this workflow is not used at all:
# GitHub serves the whole repo, the app lives at /web/, and the root index.html redirects
# there. Either way the branch has to be `main`, which is what the one below now says —
# it named `claude/sdr-flex-toolkit-planning-c4ghl1`, the branch that was trunk by
# accident until `main` took over, and which has not moved since. A deploy trigger
# pointing at a frozen branch is a site that silently stops updating.
name: Deploy toy model

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
