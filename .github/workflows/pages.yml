# Deploys the M0 toy model to GitHub Pages.
#
# Only needed if Pages is set to Settings → Pages → Source → **GitHub Actions**,
# in which case web/ is published as the site root and no redirect is involved.
#
# If Pages is instead set to **Deploy from a branch**, this workflow is not used at
# all: GitHub serves the whole repo, the app lives at /web/, and the root index.html
# redirects there. That is the current setup, so this stays manual (workflow_dispatch)
# to avoid failing runs — to switch, pick "GitHub Actions" as the source and
# uncomment the push trigger below.
name: Deploy toy model

on:
  workflow_dispatch:
  # push:
  #   branches: [claude/sdr-flex-toolkit-planning-c4ghl1]
  #   paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
