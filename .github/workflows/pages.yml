# Deploys the browser client to GitHub Pages.
#
# **The hosted version is the whole tool minus the box.** `web/` is static ES modules
# with no build step, and the client falls back to its in-tab engine when no websocket
# answers (ADR-0021) — so Pages serves a working tool rather than a demo. What it cannot
# have is anything that runs as a process: the external decoders, a radio, the capture
# library. `Identify` knows this and says so rather than offering a decoder that cannot
# run. Everything else — the DSP, the flowgraph, the views, the synthetic scene, a
# capture you drop on the window — is the same code the server serves.
#
# Pages is set to Settings → Pages → Source → **GitHub Actions**, so this is the deploy:
# `web/` is published as the site root and the repository's root index.html — which
# redirects to /web/ for the other mode — is not published at all. The app is therefore
# at the site root rather than at /web/, and an old bookmark to /web/ will 404.
#
# Everything under web/ refers to itself relatively and nothing there starts with an
# underscore, so it survives being rooted anywhere. The websocket it looks for resolves
# to wss://<host>/ws, which on Pages closes without opening; the client treats that as
# "no engine here" and falls back to the in-tab one in well under a second rather than
# waiting out a timeout.
#
# The push trigger is on, which is the point of moving to Actions: the site cannot drift
# behind `main` the way it did while the trigger named a branch that had stopped moving.
name: Deploy toy model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
